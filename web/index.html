<body>
  <!-- Clean corrupted/expired Supabase auth token from web localStorage -->
  <script>
    (function () {
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && key.indexOf('sb-') === 0 && key.indexOf('-auth-token') !== -1) {
            var raw = localStorage.getItem(key);
            if (raw) {
              var parsed = JSON.parse(raw);
              var expiresAt = parsed.expires_at || (parsed.currentSession && parsed.currentSession.expires_at);
              if (expiresAt && (expiresAt * 1000) < Date.now()) {
                console.log('[Ali] Clearing expired Supabase auth session from localStorage:', key);
                localStorage.removeItem(key);
              }
            }
          }
        }
      } catch (e) {
        console.warn('[Ali] Error checking localStorage auth tokens:', e);
      }
    })();
  </script>

  <!-- AudioContext & Speech Auto-Unlocker for Mobile & Web Browsers -->
  <script>
    (function () {
      var audioUnlocked = false;
      function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;

        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            var ctx = new AudioCtx();
            if (ctx.state === 'suspended') {
              ctx.resume();
            }
            var buffer = ctx.createBuffer(1, 1, 22050);
            var source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);
          }
        } catch (e) {}

        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.resume();
            var silent = new SpeechSynthesisUtterance('');
            silent.volume = 0;
            window.speechSynthesis.speak(silent);
          }
        } catch (e) {}

        window.removeEventListener('click', unlockAudio, true);
        window.removeEventListener('touchstart', unlockAudio, true);
      }

      window.addEventListener('click', unlockAudio, true);
      window.addEventListener('touchstart', unlockAudio, true);
    })();

    // Robust Web Speech Helper
    window.aliSpeakText = function (text, lang, isUmma, voiceName) {
      if (!('speechSynthesis' in window) || !text) return;

      // Batalkan utterance sebelumnya lalu tunggu sebentar baru speak
      // Ini pola yang paling andal di iOS Safari & Android Chrome
      try { window.speechSynthesis.cancel(); } catch(e) {}

      setTimeout(function() {
        try {
          window.speechSynthesis.resume();

          var isArabic = /[\u0600-\u06FF]/.test(text);
          var targetLang = lang || (isArabic ? 'ar-SA' : 'id-ID');

          var utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = targetLang;
          utterance.rate = isArabic ? 0.3 : 0.85;
          utterance.pitch = isUmma ? 1.30 : 1.0;
          utterance.volume = 1.0;

          var voices = window.speechSynthesis.getVoices();
          if (voices && voices.length > 0) {
            var selectedVoice = null;

            // 1. Explicit voiceName
            if (voiceName) {
              for (var i = 0; i < voices.length; i++) {
                if (voices[i].name === voiceName) { selectedVoice = voices[i]; break; }
              }
            }

            // 2. Arabic voice (Prioritaskan Majed / Maged)
            if (!selectedVoice && (targetLang.indexOf('ar') === 0 || isArabic)) {
              for (var i = 0; i < voices.length; i++) {
                var v = voices[i];
                var vName = (v.name || '').toLowerCase();
                if (vName.indexOf('majed') !== -1 || vName.indexOf('maged') !== -1) {
                  selectedVoice = v; break;
                }
              }
              if (!selectedVoice) {
                for (var i = 0; i < voices.length; i++) {
                  var v = voices[i];
                  var vLang = (v.lang || '').toLowerCase().replace('_', '-');
                  var vName = (v.name || '').toLowerCase();
                  if (vLang.indexOf('ar') === 0 || vName.indexOf('arabic') !== -1 || vName.indexOf('tarik') !== -1) {
                    selectedVoice = v; break;
                  }
                }
              }
            }

            // 3. Indonesian voice
            if (!selectedVoice && !isArabic) {
              for (var i = 0; i < voices.length; i++) {
                if ((voices[i].name || '').toLowerCase().indexOf('damayanti') !== -1) {
                  selectedVoice = voices[i]; break;
                }
              }
              if (!selectedVoice) {
                for (var i = 0; i < voices.length; i++) {
                  var v = voices[i];
                  var vLang = (v.lang || '').toLowerCase().replace('_', '-');
                  if (vLang.indexOf('id') === 0) { selectedVoice = v; break; }
                }
              }
            }

            if (selectedVoice) {
              utterance.voice = selectedVoice;
              utterance.lang = selectedVoice.lang;
            }
          }

          window.speechSynthesis.speak(utterance);
          console.log('[Ali TTS] Speaking:', text, 'lang:', utterance.lang, 'rate:', utterance.rate);
        } catch (err) {
          console.error('[Ali TTS] Speak error:', err);
        }
      }, 50);
    };

    // Pre-load voices on web
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = function () {
        window.speechSynthesis.getVoices();
      };
      window.speechSynthesis.getVoices();
    }
  </script>

  <!-- Google Identity Services (Native One-Tap & Popup) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.aliGoogleSignIn = function (clientId) {
      return new Promise(function (resolve, reject) {
        if (!window.google || !window.google.accounts) {
          reject(new Error("Google Identity Services not loaded yet"));
          return;
        }

        try {
          var client = google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: 'email profile openid',
            callback: function (tokenResponse) {
              if (tokenResponse && tokenResponse.access_token) {
                resolve({
                  access_token: tokenResponse.access_token,
                  id_token: tokenResponse.id_token || null
                });
              } else if (tokenResponse && tokenResponse.error) {
                reject(new Error(tokenResponse.error));
              } else {
                reject(new Error("Unknown Google response"));
              }
            },
            error_callback: function (nonOAuthError) {
              reject(new Error(nonOAuthError.message || "Google OAuth error"));
            }
          });
          client.requestAccessToken();
        } catch (e) {
          reject(e);
        }
      });
    };
  </script>

  <script>
    // Prevent CanvasKit LateInitializationError on Hot Restart
    window.addEventListener('webglcontextlost', function(e) {
      e.preventDefault();
    }, false);

    // Dedicated HTML5 Audio Player for Web Quran & Media Streaming
    window._aliWebAudio = new Audio();
    window._aliWebAudioPosInterval = null;

    window.aliPlayAudioUrl = function(url, onEndedCallback, onPositionCallback) {
      if (!url || url === '') {
        console.warn('[Ali Web Audio] aliPlayAudioUrl called with empty URL, ignoring.');
        return;
      }
      try {
        // Stop previous audio cleanly
        if (window._aliWebAudio) {
          try { window._aliWebAudio.pause(); } catch(e) {}
          window._aliWebAudio.onended = null;
          window._aliWebAudio.ontimeupdate = null;
          window._aliWebAudio.onerror = null;
        }

        // Create a fresh Audio element for each playback to avoid stale state
        var audio = new Audio();
        window._aliWebAudio = audio;

        // cdn.alquran.cloud supports CORS, so crossOrigin anonymous is fine
        audio.crossOrigin = 'anonymous';
        audio.preload = 'auto';
        audio.src = url;

        if (onEndedCallback) {
          audio.onended = function() { try { onEndedCallback(); } catch(e) {} };
        }
        if (onPositionCallback) {
          audio.ontimeupdate = function() {
            try {
              var posMs = Math.round((audio.currentTime || 0) * 1000);
              onPositionCallback(posMs);
            } catch(e) {}
          };
        }
        audio.onerror = function(e) {
          console.warn('[Ali Web Audio] Error loading audio URL:', url, 'code:', audio.error && audio.error.code);
        };

        audio.load();
        var p = audio.play();
        if (p !== undefined) {
          p.catch(function(err) {
            console.warn('[Ali Web Audio] play() blocked:', err.message || err);
          });
        }
      } catch (e) {
        console.error('[Ali Web Audio] Init error:', e);
      }
    };

    window.aliStopAudio = function() {
      try {
        if (window._aliWebAudioPosInterval) {
          clearInterval(window._aliWebAudioPosInterval);
          window._aliWebAudioPosInterval = null;
        }
        if (window._aliWebAudio) {
          window._aliWebAudio.pause();
          window._aliWebAudio.currentTime = 0;
        }
      } catch (e) {}
    };

    window.aliPauseAudio = function() {
      try {
        if (window._aliWebAudio) {
          window._aliWebAudio.pause();
        }
      } catch (e) {}
    };

    window.aliResumeAudio = function() {
      try {
        if (window._aliWebAudio) {
          window._aliWebAudio.play();
        }
      } catch (e) {}
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
